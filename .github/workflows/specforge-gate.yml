# .github/workflows/specforge-gate.yml
name: specforge-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    uses: zalmb8/specforge/.github/workflows/gate.yml@v0

  # Merges a spec/ PR as soon as a human approves it and the gate is green.
  merge:
    needs: gate
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    permissions:
      contents: write
      pull-requests: write
    uses: zalmb8/specforge/.github/workflows/merge-on-approval.yml@v0

# .github/workflows/specforge-gate.yml
name: specforge-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    uses: zalmb8/specforge/.github/workflows/gate.yml@v0

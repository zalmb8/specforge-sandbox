# .github/workflows/specforge-gate.yml
name: specforge-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    uses: zalmb8/specforge/.github/workflows/gate.yml@v0

  # Merges a spec/ PR as soon as a human approves it and the gate is green.
  merge:
    needs: gate
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      startsWith(github.event.pull_request.head.ref, 'spec/')
    permissions:
      contents: write
      pull-requests: write
      checks: read
    uses: zalmb8/specforge/.github/workflows/merge-on-approval.yml@v0

  # When commits are pushed to a spec/ or build/ PR, dismiss approvals given on older commits and
  # re-request the reviewers, so GitHub's "approved" state matches what the gate accepts.
  dismiss-stale:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      (startsWith(github.event.pull_request.head.ref, 'spec/') || startsWith(github.event.pull_request.head.ref, 'build/'))
    permissions:
      contents: read
      pull-requests: write
    uses: zalmb8/specforge/.github/workflows/dismiss-stale.yml@v0

# .github/workflows/specforge-gate.yml
name: specforge-gate
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: zalmb8/specforge/.github/workflows/gate.yml@v0
